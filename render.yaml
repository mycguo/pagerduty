services:
  - type: web
    name: web-monitoring-dashboard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8501
      - key: DATA_DIR
        value: /app/data
      - key: RENDER
        value: "true"
    # NOTE: Add these environment variables in Render Dashboard:
    # REQUIRED:
    #   - DATABASE_URL: Your Neon/external PostgreSQL connection string
    #                   (Using external DB avoids Render's 90-day free tier expiration)
    # OPTIONAL:
    #   - SLACK_WEBHOOK_URL: For Slack alerts
    #   - SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM_EMAIL: For email alerts
    #
    # To add environment variables:
    # 1. Go to your service → Environment tab
    # 2. Click "Add Environment Variable"
    # 3. Add the variable name and value
    # 4. Click "Save Changes" (triggers automatic redeploy)

